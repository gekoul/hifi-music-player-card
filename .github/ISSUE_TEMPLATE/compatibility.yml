name: Player compatibility report
description: Tell us how the card works with your player
labels: [compatibility]
body:
  - type: input
    id: integration
    attributes: { label: Integration, description: "e.g. Music Assistant (AirPlay), Sonos, Bluesound" }
    validations: { required: true }
  - type: input
    id: model
    attributes: { label: Player model }
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Play / pause / stop
        - label: Previous / next
        - label: Seek
        - label: Volume
        - label: Mute
        - label: Shuffle / repeat
        - label: Playing from the media browser
        - label: Queue (play next / add)
  - type: textarea
    id: notes
    attributes: { label: Notes }
