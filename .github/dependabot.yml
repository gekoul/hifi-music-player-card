version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
